<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hướng dẫn sử dụng KLASSA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Hướng dẫn sử dụng phần mềm KLASSA — quản lý trung tâm dạy học toàn diện. 134 bài chi tiết kèm hình ảnh thực tế từ demo.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234f46e5'/%3E%3Cstop offset='50%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='66' font-family='Inter,sans-serif' font-size='52' font-weight='800' text-anchor='middle' fill='white'%3EK%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      --brand-1: #4f46e5;
      --brand-2: #2563eb;
      --brand-3: #06b6d4;
      --brand-grad: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 50%, var(--brand-3) 100%);
      --theme-color: var(--brand-1);

      --bg: #ffffff;
      --bg-elevated: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-muted: #f1f5f9;
      --fg: #0f172a;
      --fg-muted: #475569;
      --fg-subtle: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --accent: var(--brand-1);
      --code-bg: #f1f5f9;
      --code-fg: #4f46e5;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, .06), 0 1px 2px rgba(15, 23, 42, .04);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, .08);
      --ring: rgba(79, 70, 229, .2);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --sidebar-width: 300px;
      --ease: cubic-bezier(.4, 0, .2, 1);
    }

    [data-theme="dark"] {
      --bg: #0a0e1a;
      --bg-elevated: #111827;
      --bg-subtle: #0f172a;
      --bg-muted: #1e293b;
      --fg: #f1f5f9;
      --fg-muted: #cbd5e1;
      --fg-subtle: #94a3b8;
      --border: #1e293b;
      --border-strong: #334155;
      --accent: #818cf8;
      --code-bg: #1e293b;
      --code-fg: #a5b4fc;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, .4);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
      --ring: rgba(129, 140, 248, .25);
    }

    /* ============================================================
       BASE
       ============================================================ */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      color: var(--fg);
      transition: background-color .3s var(--ease), color .3s var(--ease);
      line-height: 1.6;
    }
    ::selection { background: var(--brand-1); color: white; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg-subtle); }

    /* Hide cover entirely (we use README as landing) */
    section.cover { display: none !important; }

    /* ============================================================
       SIDEBAR
       ============================================================ */
    body .sidebar {
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      width: var(--sidebar-width);
      padding: 20px 0 80px;
      transition: transform .3s var(--ease), background-color .3s var(--ease);
    }
    .sidebar > h1 {
      padding: 8px 24px 20px;
      margin: 0;
      border-bottom: 1px solid var(--border);
    }
    .sidebar > h1 a {
      font-size: 1.125rem;
      font-weight: 700;
      background: var(--brand-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -.02em;
      text-decoration: none;
    }
    .sidebar .search {
      padding: 16px 20px;
      margin: 0 !important;
      border-bottom: 1px solid var(--border);
    }
    .sidebar .search input {
      background: var(--bg-subtle) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-md) !important;
      padding: 10px 14px !important;
      font-size: .9rem !important;
      color: var(--fg) !important;
      transition: all .2s var(--ease);
      font-family: inherit !important;
      width: 100%;
    }
    .sidebar .search input:focus {
      outline: none !important;
      border-color: var(--brand-1) !important;
      box-shadow: 0 0 0 3px var(--ring) !important;
    }
    .sidebar .search input::placeholder { color: var(--fg-subtle); }
    .sidebar-nav { padding: 16px 12px !important; margin: 0 !important; }
    .sidebar-nav > ul { padding: 0 !important; margin: 0 !important; list-style: none; }
    .sidebar-nav > ul > li { list-style: none; margin: 2px 0; }
    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > strong {
      display: block;
      font-size: .72rem !important;
      font-weight: 700 !important;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--fg-subtle) !important;
      padding: 18px 12px 8px !important;
      margin: 0 !important;
    }
    .sidebar-nav ul ul { padding: 0 !important; margin: 0 !important; list-style: none; }
    .sidebar-nav li { list-style: none !important; margin: 1px 0 !important; }
    .sidebar-nav a {
      display: block;
      padding: 8px 12px !important;
      margin: 0 !important;
      font-size: .9rem !important;
      font-weight: 500 !important;
      color: var(--fg-muted) !important;
      border-radius: var(--radius-sm) !important;
      transition: all .15s var(--ease) !important;
      position: relative;
      line-height: 1.4;
      border: none !important;
      text-decoration: none !important;
    }
    .sidebar-nav a:hover {
      background: var(--bg-muted) !important;
      color: var(--fg) !important;
    }
    .sidebar-nav li.active > a {
      background: var(--bg-muted) !important;
      color: var(--accent) !important;
      font-weight: 600 !important;
    }
    .sidebar-nav li.active > a::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      background: var(--brand-grad);
      border-radius: 0 4px 4px 0;
    }

    /* ============================================================
       CONTENT
       ============================================================ */
    main { background: var(--bg) !important; position: relative; }
    .content { padding-top: 0 !important; }

    .markdown-section {
      max-width: 880px !important;
      padding: 64px 64px 80px !important;
      font-size: 16px;
      line-height: 1.75;
      color: var(--fg);
      margin: 0 auto;
    }

    .markdown-section > *:first-child {
      margin-top: 0 !important;
    }

    .markdown-section h1, .markdown-section h2, .markdown-section h3,
    .markdown-section h4, .markdown-section h5, .markdown-section h6 {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.25;
      color: var(--fg);
      scroll-margin-top: 24px;
    }
    .markdown-section h1 {
      font-size: clamp(2rem, 4.5vw, 3rem);
      font-weight: 800;
      letter-spacing: -.035em;
      margin: 0 0 16px;
      background: var(--brand-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-bottom: 0;
      border: none;
    }
    .markdown-section h2 {
      font-size: 1.5rem;
      margin-top: 56px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .markdown-section h3 {
      font-size: 1.2rem;
      margin-top: 36px;
      margin-bottom: 12px;
    }
    .markdown-section h4 {
      font-size: 1.05rem;
      margin-top: 28px;
      margin-bottom: 8px;
    }
    .markdown-section p {
      margin: 16px 0;
      color: var(--fg);
    }
    .markdown-section p:first-of-type {
      font-size: 1.075rem;
      color: var(--fg-muted);
      line-height: 1.7;
    }
    .markdown-section a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: border-color .15s var(--ease);
    }
    .markdown-section a:hover { border-bottom-color: var(--accent); }

    .markdown-section blockquote {
      margin: 24px 0;
      padding: 16px 20px;
      background: var(--bg-subtle);
      border-left: 4px solid var(--brand-1);
      border-radius: var(--radius-md);
      color: var(--fg-muted);
      font-style: normal;
    }
    .markdown-section blockquote p { margin: 0; }
    .markdown-section blockquote strong { color: var(--fg); }

    .markdown-section code {
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 2px 6px;
      border-radius: 5px;
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: .875em;
      font-weight: 500;
      border: none;
    }
    .markdown-section pre {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      overflow-x: auto;
    }
    .markdown-section pre code {
      background: transparent;
      color: var(--fg);
      padding: 0;
    }

    /* Tables */
    .markdown-section table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 24px 0 !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-md);
      overflow: hidden;
      font-size: .95rem;
      display: table !important;
      background: var(--bg-elevated);
    }
    .markdown-section table th {
      background: var(--bg-subtle) !important;
      color: var(--fg) !important;
      font-weight: 600 !important;
      padding: 14px 18px !important;
      text-align: left;
      border: none !important;
      border-bottom: 1px solid var(--border) !important;
      font-size: .9rem;
    }
    .markdown-section table td {
      padding: 14px 18px !important;
      border-top: 1px solid var(--border) !important;
      border-left: none !important;
      border-right: none !important;
      border-bottom: none !important;
      background: transparent !important;
      color: var(--fg) !important;
    }
    .markdown-section table tr:first-child td { border-top: none !important; }
    .markdown-section table tr:hover td { background: var(--bg-subtle) !important; }

    /* Lists */
    .markdown-section ul, .markdown-section ol {
      padding-left: 24px;
      margin: 16px 0;
    }
    .markdown-section li { margin: 8px 0; }
    .markdown-section li::marker { color: var(--accent); }

    /* Images */
    .markdown-section img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin: 20px 0;
      transition: transform .3s var(--ease);
      display: block;
    }
    .markdown-section img:hover {
      transform: scale(1.005);
      box-shadow: var(--shadow-lg);
    }

    .markdown-section hr {
      border: none;
      height: 1px;
      background: var(--border);
      margin: 48px 0;
    }

    /* ============================================================
       LANDING HERO — when on README route, beautify first H1
       ============================================================ */
    body[data-route="/"] .markdown-section,
    body[data-route=""] .markdown-section {
      max-width: 1100px !important;
    }
    body[data-route="/"] .markdown-section > h1:first-child,
    body[data-route=""] .markdown-section > h1:first-child {
      font-size: clamp(2.5rem, 6vw, 4rem);
      text-align: left;
      margin-bottom: 12px;
    }
    body[data-route="/"] .markdown-section > p:first-of-type,
    body[data-route=""] .markdown-section > p:first-of-type {
      font-size: 1.25rem;
      color: var(--fg-muted);
      max-width: 720px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    body[data-route="/"] .markdown-section::before,
    body[data-route=""] .markdown-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 360px;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(ellipse 50% 60% at 15% 0%, rgba(79, 70, 229, .12), transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 10%, rgba(6, 182, 212, .10), transparent 70%);
    }
    [data-theme="dark"] body[data-route="/"] .markdown-section::before,
    [data-theme="dark"] body[data-route=""] .markdown-section::before {
      background:
        radial-gradient(ellipse 50% 60% at 15% 0%, rgba(79, 70, 229, .22), transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 10%, rgba(6, 182, 212, .18), transparent 70%);
    }

    /* ============================================================
       THEME TOGGLE
       ============================================================ */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      z-index: 100;
      transition: all .2s var(--ease);
    }
    .theme-toggle:hover {
      transform: scale(1.05);
      border-color: var(--brand-1);
      color: var(--brand-1);
    }
    .theme-toggle svg { width: 18px; height: 18px; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    /* ============================================================
       SEARCH
       ============================================================ */
    .search .results-panel {
      background: var(--bg-elevated) !important;
      color: var(--fg) !important;
    }
    .search .matching-post {
      border-bottom: 1px solid var(--border) !important;
      padding: 12px 0 !important;
    }
    .search .matching-post:hover { background: var(--bg-subtle) !important; }
    .search .matching-post h2, .search .matching-post p { color: var(--fg) !important; }
    .search .search-keyword {
      background: var(--brand-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: normal !important;
      font-weight: 600;
    }

    /* ============================================================
       PAGINATION
       ============================================================ */
    .docsify-pagination-container {
      max-width: 880px !important;
      padding: 32px 64px 64px !important;
      border-top: 1px solid var(--border);
      margin: 56px auto 0 !important;
    }
    .pagination-item-label {
      color: var(--fg-subtle) !important;
      font-size: .8rem !important;
      font-weight: 500;
    }
    .pagination-item-title {
      color: var(--fg) !important;
      font-weight: 600 !important;
    }
    .pagination-item:hover .pagination-item-title { color: var(--accent) !important; }

    .docsify-copy-code-button {
      background: var(--bg-muted) !important;
      color: var(--fg-muted) !important;
      border-radius: 0 var(--radius-md) 0 var(--radius-md) !important;
      font-size: .75rem !important;
      font-weight: 500 !important;
    }
    .docsify-copy-code-button.success {
      background: var(--brand-1) !important;
      color: white !important;
    }

    /* ============================================================
       MOBILE
       ============================================================ */
    .sidebar-toggle {
      position: fixed !important;
      top: 12px !important;
      left: 12px !important;
      width: 40px !important;
      height: 40px !important;
      background: var(--bg-elevated) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      box-shadow: var(--shadow-md) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      z-index: 99 !important;
      padding: 0 !important;
    }
    .sidebar-toggle span, .sidebar-toggle div {
      background: var(--fg) !important;
      height: 2px !important;
      width: 18px !important;
      margin: 2px 0 !important;
      border-radius: 1px;
    }

    @media (min-width: 769px) {
      .sidebar-toggle { display: none !important; }
    }

    @media (max-width: 768px) {
      :root { --sidebar-width: 280px; }
      body .sidebar {
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
        position: fixed;
        top: 0; bottom: 0; left: 0;
        z-index: 50;
      }
      body.close .sidebar { transform: translateX(0); }
      body.close::after {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .4);
        z-index: 49;
      }
      .content { left: 0 !important; padding-top: 0 !important; }
      .markdown-section { padding: 72px 20px 40px !important; }
      .docsify-pagination-container { padding: 24px 20px 40px !important; }
      .theme-toggle {
        top: 12px;
        right: 12px;
        width: 38px;
        height: 38px;
      }
      .markdown-section table {
        font-size: .85rem;
        display: block !important;
        overflow-x: auto;
        white-space: nowrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">Đang tải tài liệu...</div>

  <button class="theme-toggle" id="theme-toggle" aria-label="Chuyển sáng / tối">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>

  <script>
    (function () {
      var stored = localStorage.getItem('klassa-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('klassa-theme', next);
    });

    // Mark body with current route (for landing hero styling)
    function updateRoute() {
      var hash = location.hash.replace(/^#/, '');
      if (!hash || hash === '/' || hash === '/README' || hash === '/README.md') {
        document.body.setAttribute('data-route', '/');
      } else {
        document.body.setAttribute('data-route', hash);
      }
    }
    window.addEventListener('hashchange', updateRoute);
    window.addEventListener('DOMContentLoaded', updateRoute);
    updateRoute();

    window.$docsify = {
      name: 'KLASSA Docs',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 0,
      maxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
      search: {
        placeholder: 'Tìm trong tài liệu...',
        noData: 'Không tìm thấy kết quả',
        depth: 6,
      },
      pagination: {
        previousText: '← Bài trước',
        nextText: 'Bài tiếp →',
        crossChapter: true,
        crossChapterText: true,
      },
      copyCode: {
        buttonText: 'Sao chép',
        errorText: 'Lỗi',
        successText: 'Đã chép',
      },
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
